<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 外部への通信を一切させない（ライブラリは Google Fonts を取りに行こうとする） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' ppv: data: blob:; script-src 'self' ppv: 'unsafe-inline' 'unsafe-eval'; style-src 'self' ppv: 'unsafe-inline' data: blob:; img-src 'self' ppv: data: blob:; font-src 'self' ppv: data: blob:; connect-src 'self' ppv: data: blob:; media-src 'self' ppv: data: blob:; worker-src 'self' ppv: blob:">
<link rel="stylesheet" href="viewer.css">
<style>
  html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #292929; }
  .ppv-host { position: absolute; inset: 0; }
  .ppv-host.ppv-pending { visibility: hidden; }
  /* ノートはアプリ側の欄に出すので、ライブラリのノート欄は隠す */
  .pptxv-notes, .pptxv-notes-region { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="viewer.js"></script>
</body>
</html>
