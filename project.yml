name: Proofdeck
options:
  bundleIdPrefix: com.mitsuba
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    OTHER_SWIFT_FLAGS: "-enable-bare-slash-regex"
    # 個人の Apple Developer ID を手に入れるまでは ad-hoc 署名
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Proofdeck:
    type: application
    platform: macOS
    sources:
      - path: Sources/Proofdeck
      - path: Resources/web
        type: folder
        buildPhase: resources
    # Info.plist と権限の設定ファイルは、ここに書いた内容から xcodegen が作る（直接書き換えても上書きされる）
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Proofdeck
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PowerPoint プレゼンテーション
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.presentationml.presentation
              - org.openxmlformats.presentationml.slideshow
              - org.openxmlformats.presentationml.template
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsuba.proofdeck
        PRODUCT_NAME: Proofdeck
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ProofdeckPreview
        embed: true
      # MCP サーバーを Contents/MacOS に同梱する
      - target: proofdeck-mcp
        embed: true
        copy:
          destination: executables
  ProofdeckPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookPreview
        excludes: ["*.plist", "*.entitlements"]
      - path: Sources/Proofdeck/WebSlideView.swift
      - path: Resources/web
        type: folder
        buildPhase: resources
    info:
      path: Sources/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Proofdeck Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - org.openxmlformats.presentationml.presentation
              - org.openxmlformats.presentationml.slideshow
              - org.openxmlformats.presentationml.template
    # WebKit の部品が動くのに network.client が要る。外部への読み込みは、ページ側と WebKit の規則で止めている
    entitlements:
      path: Sources/QuickLookPreview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsuba.proofdeck.preview
        PRODUCT_NAME: ProofdeckPreview
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  proofdeck-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/proofdeck-mcp
    settings:
      base:
        PRODUCT_NAME: proofdeck-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsuba.proofdeck.mcp
        SKIP_INSTALL: YES
